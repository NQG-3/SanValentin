<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¿Quieres ser mi San Valentín?</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffc3a0, #ff9a9e);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: rgba(255,255,255,0.95);
      padding: 60px;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 2;
    }

    h1 {
      color: #e91e63;
      margin-bottom: 40px;
      font-size: 32px;
      font-weight: 700;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    button {
      padding: 15px 40px;
      font-size: 18px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }

#yesBtn {
  background-color: #e91e63;
  color: white;
  position: relative;
  z-index: 1; /* Más bajo */
}

#noBtn {
  background-color: #ddd;
  position: relative;
  z-index: 10; /* Más alto, queda por encima */
}
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      opacity: 0;
      pointer-events: none;
      transition: 0.5s;
      z-index: 9999;
      overflow: hidden;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .overlay-message {
      background: white;
      padding: 70px;
      border-radius: 30px;
      font-size: 36px;
      font-weight: 700;
      color: #e91e63;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      z-index: 5;
    }

    .heart, .floating-img {
      position: absolute;
      animation: float linear infinite;
      z-index: 1;
    }

    .floating-img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    @keyframes float {
      0% { transform: translateY(110vh) scale(1); opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>¿Quieres ser mi San Valentín? 🤎</h1>
    <div class="buttons">
      <button id="yesBtn">Sí 💘</button>
      <button id="noBtn">No 😢</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="overlay-message">¡Sabía que dirías que sí! 👑🤎✨</div>
  </div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const overlay = document.getElementById('overlay');

    const noTexts = [
      "¿Estás segura? 😳",
      "Niñaaaa como que nooooo 😳",
      "Piénsalo otra vez 🥺",
      "DALE AL SI YAAAAA 😡😡😡",
      "¿Porque? 💔",
      "Vamos... di que sí 😏",
      "Última oportunidad 👀",
      "Te vas a arrepentir 😜"
    ];

    // 🔥 PON AQUÍ TUS FOTOS (links o nombres si están en la misma carpeta)
    const images = [
      "foto1.JPG",
      "foto2.jpeg",
      "foto3.jpeg",
      "foto4.JPG",
      "foto5.JPG",
      "foto6.JPG",
      "foto7.jpeg",
      "foto8.JPG",
      "foto9.JPG"
    ];

    let scale = 1;
    let animationInterval;

    noBtn.addEventListener('click', () => {
      scale += 0.15;
      yesBtn.style.transform = `scale(${scale})`;
      const randomText = noTexts[Math.floor(Math.random() * noTexts.length)];
      noBtn.textContent = randomText;
    });

    yesBtn.addEventListener('click', () => {
      overlay.classList.add('show');
      startInfiniteAnimation();
    });

    function startInfiniteAnimation() {
      animationInterval = setInterval(() => {
        createHeart();
        createFloatingImage();
      }, 400); // velocidad de aparición (más pequeño = más intenso)
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '🤎';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (Math.random() * 30 + 15) + 'px';
      heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
      overlay.appendChild(heart);
      setTimeout(() => heart.remove(), 8000);
    }

    function createFloatingImage() {
      const img = document.createElement('img');
      const randomImg = images[Math.floor(Math.random() * images.length)];
      img.src = randomImg;
      img.classList.add('floating-img');
      img.style.left = Math.random() * 100 + 'vw';
      img.style.animationDuration = (Math.random() * 5 + 5) + 's';
      overlay.appendChild(img);
      setTimeout(() => img.remove(), 10000);
    }
  </script>
</body>
</html>
